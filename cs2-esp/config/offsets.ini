; cs2-esp offset table
; Values here override the compiled-in defaults at startup.
; Hex (0x...) or decimal both parse. Anything after ; or # is a comment.
;
; After a CS2 update, regenerate with any offset dumper and paste the new
; values in. Only the keys you list are overridden.

[client.dll]
dwEntityList            = 0x1A0F0D8
dwLocalPlayerController = 0x1A31F68
dwLocalPlayerPawn       = 0x1948E58
dwViewMatrix            = 0x1A2A5A0
dwPlantedC4             = 0x1A32748

[CBasePlayerController]
m_hPlayerPawn           = 0x7EC
m_sSanitizedPlayerName  = 0x760
m_bPawnIsAlive          = 0x7E4

[C_CSPlayerPawn]
m_iHealth               = 0x344
m_iTeamNum              = 0x3E3
m_lifeState             = 0x348
m_ArmorValue            = 0x1650
m_vOldOrigin            = 0x1324
m_pGameSceneNode        = 0x328
m_bIsScoped             = 0x2400
m_pClippingWeapon       = 0x13C0

[CGameSceneNode]
m_dwBoneArray           = 0x1F0
m_bDormant              = 0xEF
m_vecAbsOrigin          = 0xD0

; Structural constants. These only move if Valve reshapes the entity list
; or the bone struct, which is rare.
[layout]
boneStride              = 0x20
chunkStride             = 0x8
chunkBase               = 0x10
entryStride             = 120
